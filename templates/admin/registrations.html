{% extends "base.html" %}

{% block title %} {{ event.code }} Registration Listing {% endblock %}


{% block content %}
    <div class="m-5 text-center">
        <h1>{{ event.season }}{{ event.code }} Registration Listing</h1>
    </div>

<form action="" method="post" novalidate>
  {% csrf_token %}
  {% load crispy_forms_tags %}
  {{ form|crispy }}
  <button type="submit" class="btn btn-success"><i class="bi bi-floppy-fill"></i> Save Registrations</button>
</form>
{% endblock %}
